# Text the hooks add to the game, one table per screen. Every language needs
# every key; a missing one falls back to English. Codes are the languages
# DQ9 has text for (en fr de it es); scripts/gen-lang.py embeds them.
name = "English"

[main_menu]
options = "Options"
import_save = "Import save file"
export_save = "Export save file"
# Shown when a newer release is out (src/hooks/options_row.cpp); {} is
# its version.
update = "Update to {}"
# The notice while it downloads; {version} and {percent} are filled in.
# The notice font has no accents: they are dropped.
downloading = "Downloading {version} {percent}"
# The last row: closes the game (src/hooks/options_row.cpp).
quit = "Quit game"

# The Misc. list's Options row (src/hooks/camp_options.cpp).
[camp_menu]
options_description = "Change the general, display and control settings."

# The Options pages (src/hooks/options_row.cpp). Keys are built from the
# runtime menu's rows: cat_<section>, <row key with _ for .>, v_<choice>,
# each lower case with _ for anything but letters and digits. A row or
# choice without a key shows the runtime menu's English text. Accents use
# the game's own tags (<'e> <`a> <:u> <^e> <,c> <~n> <ss>).
[options]
cat_general = "General"
cat_display = "Display"
cat_controls = "Controls"
