[game]
# Data directory name: settings, saves and savestates live there.
app_name = "DQ9Recompiled"
# Shown before the ROM's own title can be read (the first-launch prompt).
name = "Dragon Quest IX"
id = "YDQP"
region = "Europe"
revision = 0
status = "static-scan banks: ARM9 main, ARM7, 31 overlays, firmware boot (no interpreter)"
rom = "dq9.nds"
rom_size = 0x10000000
sha1 = "ff761d349709f329c8ac4bd0023fdce21861e8a1"

# The known releases. The player's ROM is unpacked into <data>/assets/<id>.
# The one with [game].sha1 runs on this build as it is; a release the build
# has a recipe for (scripts/build.py RECIPE_RELEASES: YDQE) gets its code
# rebuilt as Europe's when it is unpacked, and then runs the same way.
[[game.releases]]
id = "YDQP"
name = "Europe"
sha1 = "ff761d349709f329c8ac4bd0023fdce21861e8a1"

[[game.releases]]
id = "YDQE"
name = "USA"
sha1 = "c7c3014c237900c8281289b8bc76a781969b6278"

[[game.releases]]
id = "YDQJ"
name = "Japan"
sha1 = "4b219246c06343ad56cedfb183ea3bd737776eda"

[display]
# One window led by the DS main screen (engine A's LCD). Backtick swaps the
# two screens.
screen_layout = "single"     # single | stacked | separate
scaling = "nearest"          # nearest | bilinear | integer (pixel-perfect)
# 3D detail as a % of the window's resolution (>100 supersamples). Replace
# with internal_resolution = N to pin a fixed multiplier instead.
resolution_scale = 100
# auto drops 3D to 1x while frames wait on the GPU; off keeps the chosen
# detail. NDS_PERFORMANCE_GOVERNOR / --performance-governor override it.
performance_governor = "off"  # auto | off | stage1 | stage2
# The other screen, right of the main one and bottom-aligned (above it,
# centred, in a portrait window), as a % of its size (10..100; 100 is the
# main screen's size). A minimum: in letterbox it grows into any space left
# over. Also under Options > Display.
second_screen_size = 30

[system]
startup_mode = "automatic"
# No dumps: the runner synthesizes the flash image (user settings, Wi-Fi
# slots, a per-install MAC) and boots the cartridge directly, since a
# generated image has no boot code, on the recompiled FreeBIOS in place of
# the retail BIOS. freebios = false uses biosnds7.rom and biosnds9.rom
# instead. boot = "lle" with generated_firmware = false and freebios = false
# runs a firmware dump's recompiled boot code (configure with
# -DDQ9_FIRMWARE_BANKS=ON).
boot = "direct"
generated_firmware = true
freebios = true
# Firmware user language, which YDQP uses to pick its text language:
# english, french, german, italian or spanish (or "preserve" to keep the
# firmware dump's own). Override per run with NDS_LANGUAGE or --language.
language = "english"
# check_for_updates = false  # skip the startup check for a newer release (--no-update-check)

[controls]
# Face buttons by position, as on a DS: the pad's bottom button is DS B and
# its right button DS A. "labels" matches the names instead (pad A is DS A).
gamepad_layout = "positional"

# Online DLC without the internet: the runner answers Nintendo's servers
# itself (ndsrecomp net/wfc_local_server.h) and src/hooks/wfc_downloads.cpp
# hands Sellma the downloadable quests and today's DQVC stock. Configure the
# connection in DQ9's own Wi-Fi settings (the access point is open).
[network]
enabled = true

[network.wfc]
enabled = true
provider = "built-in"

# Discord Rich Presence: "<hero>, Lv. <level> <vocation>" and "Exploring
# <place>" (or "Fighting in <place>") on the player's Discord profile, while
# the Discord desktop app runs. The application is DQ9Recompiled's (Developer Portal);
# its icon shows with the activity. Players turn it off under Options.
[discord]
application_id = "1572233082193584198"

# Local wireless (DQ9's multiplayer, the Rapportal) between runners on this
# machine and on the local network: they find each other by UDP broadcast on
# ports 26710-26725, so Windows asks once to allow the runner through its
# firewall (allow private networks). Where broadcast is blocked, list the
# other PCs in peers. link = "loopback" keeps it to this machine.
[local_wireless]
enabled = true
link = "lan"
# peers = ["192.168.1.20"]

# Netplay: the Rapportal over the internet. While it is on, only the players
# of your online lobby are in range (not the LAN). Opening the Rapportal opens
# a lobby; a guest finds it in the game's own join menu at the Stornway inn
# and joins as usual. Needs a build with -DNDS_ONLINE=ON. The lobby server is
# DQ9Recompiled's own (recomp-net-server with its coturn relay); it needs no
# sign-in. Players see only the relay's address.
[online]
enabled = false
game_name = "DQ9Recompiled"
# lobby_name = "Marco's world"   # empty: "<your name>'s lobby"
lobby_url = "ws://dq9.birabittoh.duckdns.org:80"  # port needed: sign-in uses it too (default 8765)
# stun_server = "stun.l.google.com:19302"  # Online (direct) STUN server; empty: this one

# 64 KiB EEPROM, confirmed from a working emulator save of YDQP (a raw
# 65,536-byte image starting "DRAGON QUEST IX"). The runner reads and writes
# the same raw format.
[cartridge]
save_type = "eeprom"
save_size = 65536

[arm9]
rom_offset = 0x00004000
entry_pc = 0x02000800
load_address = 0x02000000
compressed_size = 0x0009bd08
decompressed_size = 0x000f4618
overlay_count = 35

[arm7]
rom_offset = 0x001e2400
entry_pc = 0x02380000
load_address = 0x02380000
size = 0x00028fc4

[framework]
path = "ndsrecomp"
