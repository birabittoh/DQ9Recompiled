# UI size, part 2: the interaction prompt. Handler:
# src/hooks/text_box_size.cpp (part 1 is in dq9_arm9.toml).
version = 1

[program]
bank = "dq9_arm9_ov017"
sha1 = "9bed6c63eb674c6289670751193cff269085fa8b"

# The interaction prompt (the icon shown when the player can talk to an NPC
# or check an object). ov17 0x0219B33C keeps the best target's icon index at
# field+0x36B5; 0x0219AD84 (the same pixel-space pass) draws that sprite at
# its fixed screen position between its own MTX_PUSH (0x0219B084) and
# MTX_POP (0x0219B0A0). The hook, at the animation step between them,
# scales the pushed matrix about the screen centre.
[[hook]]
address = 0x0219B088      # bl 0x0204725C (step the icon's animation)
mode = "arm"
name = "Dq9InteractPrompt"

# The prompt's touch area: 0x0219AA7C tests the release position (touch
# +0x38/+0x3C, loaded into r5/r4 at 0x0219ACA8/0x0219ACAC) against the icon's
# unscaled rect (x r3, y sp+0, size r6 x r0). The hook, right before the
# compare, maps the position back through the scale the icon is drawn with.
[[hook]]
address = 0x0219ACB0      # cmp r3, r5 (r5 = touch x, r4 = touch y)
mode = "arm"
name = "Dq9InteractPromptTouch"
registers = ["r5", "r4"]

# Icons drawn over a world point (the sprite shown at a harvest spot, among
# others): each site stores the projected position at sprite+0x1C/+0x20, then
# calls 0x020473D8(sprite, 1), which pushes and pops by itself. Begin (before
# the call, r0 = sprite) pushes and scales about the sprite's own position,
# End (the next instruction, reached only by falling through) pops.
# Handlers: src/hooks/text_box_size.cpp.
[[hook]]
address = 0x021AED10      # bl 0x020473D8 (r0 = sprite)
mode = "arm"
name = "Dq9WorldIconBegin"
registers = ["r0"]

[[hook]]
address = 0x021AED14      # after the draw
mode = "arm"
name = "Dq9WorldIconEnd"

[[hook]]
address = 0x021AEDD4      # bl 0x020473D8 (r0 = sprite; harvest sprite, last frames)
mode = "arm"
name = "Dq9WorldIconBegin"
registers = ["r0"]

[[hook]]
address = 0x021AEDD8      # after the draw
mode = "arm"
name = "Dq9WorldIconEnd"

[[hook]]
address = 0x021B6150      # bl 0x020473D8 (r0 = sprite)
mode = "arm"
name = "Dq9WorldIconBegin"
registers = ["r0"]

[[hook]]
address = 0x021B6154      # after the draw
mode = "arm"
name = "Dq9WorldIconEnd"

[[hook]]
address = 0x021BFD94      # bl 0x020473D8 (r0 = sprite)
mode = "arm"
name = "Dq9WorldIconBegin"
registers = ["r0"]

[[hook]]
address = 0x021BFD98      # after the draw
mode = "arm"
name = "Dq9WorldIconEnd"

# Mouse-friendly menus, part 5 (layout menus): see dq9_arm9_ov003.toml.

[[hook]]
address = 0x021AB0F4      # cmp r1, #0 (r1 = press edge; scene at 0x021AB0C0)
mode = "arm"
name = "Dq9MouseMenuTapPress"
registers = ["r1", "sp"]

# The top screen: a click on a party member's name opens the equipment page
# (Dq9TopScreenClick in src/hooks/mouse_menus.cpp). The field step
# 0x0218CBD4(field) is skipped for that frame: the hook jumps to the entry of
# 0x021A120C(field, kind, slot), which the camp menu calls to open the page
# scene for a member (kind 3 = equipment), and that returns to the step's
# caller. The same hook, every field frame, raises the name tab under the
# mouse through the tab's own state (0x020FDC60), as the camp menu does.
[[hook]]
address = 0x0218CBD4      # push {...} (field step, r0 = field)
mode = "arm"
name = "Dq9TopScreenClick"
registers = ["r0", "r1", "r2"]
on_true = "jump"
jump_address = 0x021A120C
on_false = "continue"

# 60 FPS mode, Accurate (Game > 60 FPS mode): the main loop (0x0218B710)
# ends each pass with
#   0x0218C780  ldr r0, [r4, #0x3C8]   ; VBlanks since the last pass
#   0x0218C784  mov r9, #1
#   0x0218C788  rsb r7, r0, #2
#   0x0218C78C  b   0x0218C798         ; while (r9 < r7) OS_WaitVBlankIntr()
# then G3_SwapBuffers and one more OS_WaitVBlankIntr: two VBlanks a pass.
# The hook lowers the bound so the extra wait is skipped. Handler:
# src/hooks/frame_rate.cpp.
[[hook]]
address = 0x0218C78C      # b 0x0218C798 (r0 = VBlanks, r7 = 2 - r0)
mode = "arm"
name = "Dq9FrameRate"
registers = ["r0", "r7"]

# Netplay chat on the game's own keyboard (handler: src/hooks/game_chat.cpp;
# the scene's side is in dq9_arm9_ov012.toml). A pad's Start in the field
# opens Profile Settings > Greeting, whose OK sends the text as a chat line.
#
# The field's menu check 0x021A51A4(mgr) runs while the task queue at
# mgr+0x36FC is empty. X (r8) queues the camp menu's task, mgr+0x371C, with
# 0x020469C4. The Profile Settings task is mgr+0x3B54: type 0x2F, step
# 0x021C17FC (state at +28; +29 "from the camp menu": load overlay 3 and,
# when the scene closed all at once, scene+0x14BC, end back in the field;
# the scene at +32), set up by 0x021C17CC and queued by 0x021C1798.
[[hook]]
address = 0x021A53A0      # cmp r8, #0 (r8 = X pressed, r5 = mgr, r7 = hero)
mode = "arm"
name = "Dq9ChatFieldMenu"
registers = ["r5", "r7", "r8"]

[[hook]]
address = 0x021A53FC      # ldr r1, [r1, #0x71C] (the camp menu's task, queued next)
mode = "arm"
name = "Dq9ChatQueueTask"
registers = ["r1", "r5"]
when = "after"

[[hook]]
address = 0x021C17FC      # push (r0 = the Profile Settings task)
mode = "arm"
name = "Dq9ChatProfileTask"
registers = ["r0"]

# Inn guests, part 2 (handler: src/hooks/inn_guests.cpp, part 1 in
# dq9_arm9.toml). 0x0218F064 mode 0x4000 builds the extra character from
# the record in r7 (*(gs+9112)) into the heap r11 (scene+476); while the
# spawner builds a guest, the hook gives it that guest's own record and heap.
[[hook]]
address = 0x0218F0C0      # add r1, r7, #0x1D8 (r11 = scene+476 just set)
mode = "arm"
name = "Dq9InnGuestBuildHeap"
registers = ["r7", "r11"]
