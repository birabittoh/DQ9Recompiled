# Battle multipliers (handler src/hooks/battle_multipliers.cpp): 0x0215CE80
# initialises the battle struct (r0) once per battle; in multiplayer the
# multipliers are taken here for the whole battle.
version = 1

[program]
bank = "dq9_arm9_ov000"
sha1 = "07b9f158207669e6819a6cc7e365351ddc1442e3"

[[hook]]
address = 0x0215CE84      # mov r5, r0 (r0 = battle)
mode = "arm"
name = "Dq9BattleMultiplierSnapshot"
registers = ["r0"]

# 60 FPS mode, Accurate: the battle's slow motion (a reflected spell). At
# 0x02160A0C the step 0x02160620 turns the scaled time of the pass back into
# milliseconds; at 60 FPS and 5% speed that comes to 0 and the slow motion
# never ends. Handler: src/hooks/frame_rate.cpp.
[[hook]]
address = 0x02160A10      # add r2, r7, #0x6E00 (r0 = ms counted, r4 = ctx)
mode = "arm"
name = "Dq9BattleSlowMotionElapsed"
registers = ["r0", "r4"]

# Battle targets on the top screen (handler src/hooks/battle_targets.cpp):
# the target step 0x0217B380 (a command's state 14) takes the list widget's
# entry as the target slot, then chooses it on a new A.
[[hook]]
address = 0x0217B3B4      # mov r4, r0 (r0 = target slot from the widget)
mode = "arm"
name = "Dq9BattleTargetSlot"
registers = ["r0"]

[[hook]]
address = 0x0217B3C8      # mov r8, r0 (r0 = new A)
mode = "arm"
name = "Dq9BattleTargetChoose"
registers = ["r0"]

# Last used first (handler src/hooks/recent_commands.cpp): the command
# menu 0x0217AE90 (a command's state 13) opens the spells (state 15), the
# abilities (state 16) or the items (state 17) of the panel (r7), after which
# 0x0217AA78 puts the cursor on the last spell or ability chosen; the hooks
# reorder the panel's list first.
[[hook]]
address = 0x0217B02C      # ldrsb r0, [r6, #0x10] (Spells, r7 = panel)
mode = "arm"
name = "Dq9RecentSpellsOpen"
registers = ["r7"]

[[hook]]
address = 0x0217B15C      # ldrsb r1, [r6, #0x10] (Abilities, r7 = panel)
mode = "arm"
name = "Dq9RecentAbilitiesOpen"
registers = ["r7"]

# The spell list 0x0217B518 and the ability list 0x0217B6D0 took a choice
# (0x02171458 / 0x021716D0 stored its id in panel+0x26 and pushed the next
# state, 26 when it is refused) and noted it in the character (+2400 /
# +2402).
[[hook]]
address = 0x0217B608      # ldrsb r0, [r8, #0x18] (r8 = panel)
mode = "arm"
name = "Dq9RecentSpellChosen"
registers = ["r8"]

[[hook]]
address = 0x0217B7E0      # ldrsb r0, [r9, #0x18] (r9 = panel)
mode = "arm"
name = "Dq9RecentAbilityChosen"
registers = ["r9"]

# Items (state 17): 0x02171C04 makes the panel's item list anew each time
# it opens; the item list 0x0217B8A4 stores the chosen item's id in
# panel+0x2C and 0x02171E60 pushes the next state.
[[hook]]
address = 0x0217B228      # ldrsb r0, [r7, #0x86] (Items, r7 = panel)
mode = "arm"
name = "Dq9RecentItemsOpen"
registers = ["r7"]

[[hook]]
address = 0x0217BA68      # ldrsb r0, [r10, #0x18] (r10 = panel)
mode = "arm"
name = "Dq9RecentItemChosen"
registers = ["r10"]
