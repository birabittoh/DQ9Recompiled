# Mouse-friendly menus, part 3: the green look of the window lists. Handler:
# src/hooks/mouse_menus.cpp (Dq9MouseMenuListGreen; parts 1 and 2 are in
# dq9_arm9_ov023.toml and dq9_arm9.toml).
#
# The scenes that own a window list redraw it when its pen step (0x0205D0F0)
# returns 2, "the pen moved the cursor", and draw the entry green only while
# the pen is down: touch manager 0x02114E54 +0x5F and +0x24 (touching), then
# w+0x30 >= 0. A cursor moved by the mouse hover has no pen down, so it got
# the hand cursor without the green. The hook, on the beq that skips the
# green, lets the hover through.
version = 1

[program]
bank = "dq9_arm9_ov002"
sha1 = "4f0091ffa48afa8ca8b139906dfce6d5976276cb"

[[hook]]
address = 0x0215BBE4      # beq (Z = pen not down; camp menu)
mode = "arm"
name = "Dq9MouseMenuListGreen"
registers = ["cpsr"]

# Language: the camp menu is made once per field and only its state 0
# (0x0215624C) loads its text (str_tm_<LG>.nat into camp+0x20) and icons.
# Its step (0x02155BA8) runs the state at +0x1BB8 from the table 0x0216CD74;
# the hook, before the state is read, sends a menu that opens after a
# language change through state 0 again. Handler: src/hooks/language.cpp.
[[hook]]
address = 0x02155C34      # ldr r2, [r0, #0xBB8] (r5 = the camp menu)
mode = "arm"
name = "Dq9CampTextLanguage"
registers = ["r5"]

# The Misc. list's "Options" row and its pages. Handler:
# src/hooks/camp_options.cpp; the text is res/lang/*.toml ([main_menu]
# options, [camp_menu], [options]).
#
# The camp menu (r0 of its state steps, table 0x0216CD74, 8 bytes each) keeps
# its state at +0x1BB8 (= the id of the top window) and a sub-state at
# +0x1BC0. Misc. is state and window 0x15, step 0x02166168, with the
# description of the entry under the cursor in window 0x16:
#   - 0x02156080(camp, s16 codes[9], s16* count) lists the entries: codes
#     0..8 (2 and 8 only at times, 6 never), text 4001 + code and description
#     4020 + code in str_tm. Its callers size the window (0x0215BE00), set
#     up the cursor (0x02161CF0), build the two windows' markup (0x0215F4E8,
#     0x0215F644) and pick the chosen entry's code (0x02166344).
#   - sub-state 0 puts the cursor (+0x1BFE) on entry 0 and opens the two
#     windows (0x0215F3A0); a window that is already open is left as it is.
#   - sub-state 1 runs the list; `cmp r0, #8; addls pc, ...` switches on the
#     chosen code, and B closes both windows with 0x02156E90, which goes
#     back to the state of the window underneath.
[[hook]]
address = 0x02156154      # add r1, sp, #0 (the list is built: r7 entries at sp)
mode = "arm"
name = "Dq9CampOptionsList"
registers = ["r7", "sp"]

[[hook]]
address = 0x0215BED8      # ldrb r0, [r6] (the next window's size is set)
mode = "arm"
name = "Dq9CampOptionsSize"
registers = ["r4", "r6"]

[[hook]]
address = 0x0215F53C      # mov r1, r0 (r0 = the list window's title, r10 = camp)
mode = "arm"
name = "Dq9CampOptionsTitle"
registers = ["r0", "r10"]

[[hook]]
address = 0x0215F5E4      # mov r2, r0 (r0 = the text of entry r7, code r8)
mode = "arm"
name = "Dq9CampOptionsLabel"
registers = ["r0", "r7", "r8"]

[[hook]]
address = 0x0215F690      # mov r1, r0 (r0 = the description, r5 = camp)
mode = "arm"
name = "Dq9CampOptionsDescription"
registers = ["r0", "r5"]

[[hook]]
address = 0x021661B0      # bl 0x0205DE34 (sub-state 0, cursor just reset)
mode = "arm"
name = "Dq9CampOptionsOpen"
registers = ["r8"]

[[hook]]
address = 0x021661E0      # add r3, r8, #0x2000 (sub-state 1, every frame)
mode = "arm"
name = "Dq9CampOptionsFrame"
registers = ["r8"]
on_true = "jump"
jump_address = 0x02166588 # mov r0, r8; ...; bl 0x02156E90 (close the list)

[[hook]]
address = 0x0216627C      # cmp r0, #0 (r0 != 0: draw the list window again)
mode = "arm"
name = "Dq9CampOptionsRedraw"
registers = ["r0"]

[[hook]]
address = 0x02166344      # cmp r0, #8 (r0 = the chosen entry's code)
mode = "arm"
name = "Dq9CampOptionsChoose"
registers = ["r0"]
on_true = "jump"
jump_address = 0x021663B4 # case 1: the choice sound, then state 0x18

[[hook]]
address = 0x02166580      # cmp r0, #0 (r0 != 0: B closes the list)
mode = "arm"
name = "Dq9CampOptionsBack"
registers = ["r0", "r8"]

[[hook]]
address = 0x0216659C      # add sp, sp, #0x14 (the end of the Misc. step)
mode = "arm"
name = "Dq9CampOptionsExit"
registers = ["r8"]

# Zoom indoors. Handler: src/hooks/zoom_indoors.cpp.
#
# 0x02165B44 is the camp menu step that runs once a Zoom destination (spell,
# or chimaera wing when camp+0x1C22 is the item) is chosen. It reads the
# current map's Zoom kind, bits 0-1 of byte +14 of the map info at
# map manager (0x02012FF4) +8, forced to 0 while story flag 0x113A is set:
#   2  warp to the destination;
#   1  under a roof: 0x021ACD30(field, 0, 0, 1) starts the Zoom flight (field
#      event 1, 0x021ACDF4) with its "ceiling" byte (+638) set, so the party
#      rises, drops back and strstd message 0x39 ("bangs head on the ceiling")
#      shows;
#   0  not usable here at all, a message and back to the menu.
# The hook makes the compare see 2 for 1.
[[hook]]
address = 0x02165CDC      # cmp r7, #2 ; bne 0x02165F58  (r7 = Zoom kind)
mode = "arm"
name = "Dq9ZoomIndoors"
registers = ["r7"]
