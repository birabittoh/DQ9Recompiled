# Skip intros, part 2: the opening movie (data/movie/xenlon_OP_*.mods).
# Handler: src/hooks/skip_intros.cpp.
#
# After the overlay-20 boot sequence returns, the main loop plays the movie
# from overlay 16 unless the byte at ctx+0x7F72 is set; when it is, the game
# itself takes the else branch at 0x02001064, which only clears that byte.
# The skipped branch sets and clears ctx+0x63D6 around the movie, so leaving
# it out is neutral. The hook makes the compare see the byte set.
version = 1

[program]
bank = "dq9_arm9"
sha1 = "c45c4a9c8e8cef51da713a4a02213c001699fcbc"

[[hook]]
address = 0x02000FD8      # cmp r1, #0 ; bne 0x02001064  (r1 = ctx+0x7F72)
mode = "arm"
name = "Dq9SkipOpeningMovie"
registers = ["r1"]

# Camera distance (the Game > Camera distance setting).
# Handler: src/hooks/camera_zoom.cpp.
#
# 0x0202E0B4 applies the scene camera, the only caller of the projection
# builder (0x020C28B0, MTX_PerspectiveW with the camera's fovy sin/cos,
# aspect, near and far at cam+0x5C..0x6C). It copies the camera position
# (cam+0x120) and target (cam+0x12C) to sp+0xFC and sp+0xF0, adds shake,
# sway, the minimum height and the orbit rotation to them, then from
# 0x0202E4F8 publishes position, up and target (0x0210A250 / 25C / 268) and
# builds the view matrix from them (0x020C20E4, MTX_LookAt, into 0x0210A05C).
# The hook moves the position along the target->position line there, so
# everything the game derives from the camera sees the same moved camera.
[[hook]]
address = 0x0202E4F8      # ldr r0, =0x0210A250 (r1 = &position comes next)
mode = "arm"
name = "Dq9CameraDistance"
registers = ["sp"]

# Depth precision with the camera distance. Z-buffer depth goes as
# near / distance^2, so a camera moved back loses the small depth gaps that
# keep decals (windows on roofs, paths on the ground) in front of what they
# sit on. The projection is built at 0x0202E138 (MTX_PerspectiveW, r3 =
# near from cam+0x68, r4 = camera; position cam+0x120 and target cam+0x12C
# are final by then). The hook moves the near plane out with the camera;
# cam+0x68 itself is not changed. Dq9CameraDistanceFog undoes it when it
# maps depths back to the game's projection.
[[hook]]
address = 0x0202E138      # bl MTX_PerspectiveW
mode = "arm"
name = "Dq9CameraDistanceNear"
registers = ["r3", "r4"]

# The fog half of the camera distance setting. 0x02051D38 (per frame, r7 =
# environment block) has 0x02051254 fill r7+0x4C from the map's fog presets
# (interpolated over time of day): mode +0x50, shift +0x54, offset +0x58,
# color +0x5C, alpha +0x60, 32 densities +0x64. It then calls G3X_SetFog
# (0x020C54B4: enable, mode, shift, offset), writes FOG_COLOR and loads the
# table (0x020C5584 -> FOG_TABLE). The game swaps buffers in Z mode
# (0x020D86E0 with r1 = 0), so the dolly moves pixels through the fog curve
# non-linearly; the handler resamples shift, offset and table there.
[[hook]]
address = 0x02052208      # ldr r1, [r7, #0x50] (fog mode for G3X_SetFog)
mode = "arm"
name = "Dq9CameraDistanceFog"
registers = ["r7"]

# Maps with fixed fog (dungeons). 0x020519F4 sets a map's environment up:
# with env+0x410 = 2 (field) the fog is left to the per-frame code above;
# with 1 it sends one 56-byte preset (r4 = env + 0x288 + 0x38 * index, the
# same layout as r7+0x4C) to the hardware once, at 0x02051B78, and the
# per-frame code skips fog for it (0x02051D64). The first hook keeps that
# preset's address in r7+0x4C, which only mode 2 uses; the second makes
# the per-frame code copy the preset to r7+0x50.. each frame and take the
# fog tail at 0x02052208, so Dq9CameraDistanceFog applies to it too.
[[hook]]
address = 0x02051B78      # bl G3X_SetFog (mode 1, r4 = preset, r7 = block)
mode = "arm"
name = "Dq9CameraDistanceFixedFogPreset"
registers = ["r4", "r7"]

[[hook]]
address = 0x02051D64      # beq 0x02052238 (r0 = env+0x410 fog mode)
mode = "arm"
name = "Dq9CameraDistanceFixedFog"
registers = ["r0", "r7"]
on_true = "jump"
jump_address = 0x02052208 # the fog tail (Dq9CameraDistanceFog's hook)

# Unlock camera rotation (the Game > Unlock camera rotation setting).
# Handler: src/hooks/camera_rotation.cpp.
#
# 0x020A213C is the field camera's L/R control (r10 = camera). L (0x200)
# adds a step to the yaw, R (0x100) subtracts one, both wrapped to
# [0, 2pi) (2pi = 25736, 0x02030F40), and a yaw that lands in the band
# (0xC91, 0x57F7) is clamped to its edge: the camera turns at most pi/4
# (45 degrees) either way from the default. L+R together sets cam+0x245 bit
# 1, which eases the yaw back to cam+0x246 the short way round; that path
# is untouched. The hooks skip the clamp after each step.
[[hook]]
address = 0x020A2364      # cmp r6, r1 (L: r6 = new yaw, r1 = 0xC91)
mode = "arm"
name = "Dq9UnlockCameraRotation"
on_true = "jump"
jump_address = 0x020A2378 # mov r0, r10 ; bl 0x0202E6B8 (set yaw)

[[hook]]
address = 0x020A23C8      # cmp r6, r1 (R: r6 = new yaw, r1 = 0xC91)
mode = "arm"
name = "Dq9UnlockCameraRotation"
on_true = "jump"
jump_address = 0x020A23DC # mov r0, r10 ; bl 0x0202E6B8 (set yaw)

# A touch stops the hero's emote (with the extra buttons on). Handler:
# src/hooks/camera_rotation.cpp.
#
# 0x02053644 runs an actor's emote (actor+0x17C parts, 0 for none;
# +0x17E phase). In phase 2, the loop, a one-part emote on the hero ends
# on a fresh A, B, X or Y (0xC03 on the pad at 0x02114E30), or once its
# count at +0x184 runs out, so with a count of 0 it loops until a press.
# The hook, on the hero only (the test before it), jumps to the press's
# path on a new touch too.
[[hook]]
address = 0x02053AA4      # ldr r0, =0x02114E30 ; ldr r1, =0xC03 ; bl trigger
mode = "arm"
name = "Dq9TouchStopsEmote"
on_true = "jump"
jump_address = 0x02053AB8 # ldrsh r0, [r7, #4] ; mov r6, #1 (pressed)

# Language (the Game > Language setting). Handler: src/hooks/language.cpp.
#
# The game reads the firmware language through OS_GetOwnerInfo (0x020C99D8,
# user settings +0x64 bits 0-2 into info+0). 0x0200FB10 calls it before
# every text file load, keeps the code (2-5, anything else becomes 1) in its
# context at 0x020F33D8+5 and returns it; 0x020757C4 then replaces "<LG>" in
# the file name with "en", "fr", "de", "it" or "es" (table at 0x020F0DA0).
# So the first hook changes the language the game sees from then on.
[[hook]]
address = 0x020C99F8      # strb r2, [r4] (r2 = firmware language)
mode = "arm"
name = "Dq9Language"
registers = ["r2"]

# Text loaded once per session: overlay 17 sets up an arena (0x020E50FC,
# descriptor at 0x02153680) and has 0x020E5124 reset it and load
# article_<LG>.nat and strstd_<LG>.nat into two slots at 0x02153694. Every
# other text table is loaded with the screen or object that uses it. At the
# main loop's head (0x02000E2C: r0-r3, r12, lr and flags dead), when the
# language in the context differs from the wanted one, the hook stores the
# new one and calls 0x020E5124 again with lr = 0x02000E2C.
[[hook]]
address = 0x02000E2C      # mov r0, r7 (main loop head)
mode = "arm"
name = "Dq9LanguageReload"
registers = ["lr"]
on_true = "jump"
jump_address = 0x020E5124 # reload the articles and standard strings

# The title's menu text and logo (str_op_<LG>.bin, bg_up_<LG>.pac),
# reloaded when the language changes on the title, parse into memory of
# their own (src/hooks/language.cpp, config/hooks/dq9_arm9_ov023.toml):
# their group node's heap is a marker this hook answers. 0x02032554(heap,
# size) allocates from a heap wrapper (+0 the NNS heap, 0 for none; +4 its
# allocator), and every allocation of both parsers goes through it. True: return r0,
# the memory, at the entry, before anything is pushed.
[[hook]]
address = 0x02032554      # push {r3, r4, r5, lr} (r0 = heap, r1 = size)
mode = "arm"
name = "Dq9TitleTextAlloc"
registers = ["r0", "r1"]
on_true = "return"

# UI size (the Game > UI size setting).
# Handler: src/hooks/text_box_size.cpp.
#
# The field draw (ov17 0x021960B8) sets a pixel-space orthographic
# projection (G3_OrthoW at 0x0219617C: 0..256 x 0..192, near -1024) and
# then calls 0x020444F0 (r0 = message manager from 0x020421B0); ov000
# (battle) and ov019 call it too. It draws the message window through
# 0x02066D00(manager, 0): the frame (0x0202F414 ->
# 0x0202F46C: background quad and border cells), the glyphs (0x020417C0),
# the inline choice list (0x02044540 -> 0x0205C97C) and the prompt. Each
# piece pushes the position matrix, translates to its pixel position at
# z = 1024 (the near plane) and pops, so the hooks wrap both calls in a
# push, a scale about the screen centre and a pop.
# With a render target at manager+0x38 (the 0x02044514 path) the window is
# drawn, then the target's own draws 0x020E2404 / 0x020E2488 run; the pop
# comes after those. The 2D-mode message box and the camp menu are 2D
# layers and do not come through here (see Dq9WindowLayers below).
[[hook]]
address = 0x02044514      # mov r0, r4 (before bl 0x02066D00, target path)
mode = "arm"
name = "Dq9TextBoxBegin"
registers = ["r4"]

[[hook]]
address = 0x02044530      # pop {r4, pc}
mode = "arm"
name = "Dq9TextBoxEnd"

[[hook]]
address = 0x02044534      # mov r1, #0 (before bl 0x02066D00)
mode = "arm"
name = "Dq9TextBoxBegin"
registers = ["r4"]

[[hook]]
address = 0x0204453C      # pop {r4, pc}
mode = "arm"
name = "Dq9TextBoxEnd"

# Choice windows drawn on their own, outside the message manager's draw:
# 0x0205C97C(list, frame_drawn) draws the frame (0x0202F414), each entry's
# text (0x02045F4C -> 0x020417C0, immediate 3D like the message window) and
# places the cursor (an OBJ, scaled with the 2D layers). Callers: ov13
# 0x02184A88 (Yes/No on leaving skill point allocation), ov17 0x021AFA94,
# ov20 0x0218C974, and the message window's own choice list (0x02044540,
# list = manager+0x90). The same pair as above, after the prologue and at
# its only exit; the first also notes a shown list (+0x233, +0x232) so that
# Dq9WindowLayers scales its cursor and maps the mouse onto it when no 2D
# window is up.
[[hook]]
address = 0x0205C984      # mov r10, r0 (after push / sub sp; r0 = list)
mode = "arm"
name = "Dq9ChoiceWindowBegin"
registers = ["r0"]

[[hook]]
address = 0x0205CB5C      # add sp, sp, #0x28 (single exit)
mode = "arm"
name = "Dq9TextBoxEnd"

# The 2D windows (message manager in 2D mode, camp menu) are engine A text
# BGs; the presenter shows them at the fixed size
# (nds_gpu2d_set_fixed_size_layers). Once per 3D frame the handler sets
# BGs 1..3 and the scale about the screen centre, only in the game proper
# (main loop mode byte ctx+4 = 0/4/5/9, ctx = 0x020F33D8): the boot and
# title screens (mode 6) draw their art on those BGs.
[[hook]]
address = 0x020D86E0      # G3_SwapBuffers entry (ldr r2, =0x04000540)
mode = "arm"
name = "Dq9WindowLayers"

# The field's stylus arrow (0x02096C48(obj, x0, y0, x1, y1), from
# 0x02096834): drawn with the 3D engine in the same pixel-space pass, from
# the press point (x0, y0) to the pen. Push, translate to the press point,
# then four pieces, each in its own push/pop:
#   * the ring: push, translate (-8, -8), draw obj (0x020473D8);
#   * push, rotate towards the pen (0x020C51B4), then the shaft: push,
#     translate (0, 0, 1), push, scale (0.5, (len - 5) / 8, 1), draw
#     obj+0x88 (0x020472F4);
#   * the head: push, translate (0, len, 3), scale (0.75, -0.75, 1), draw
#     obj+0x110;
#   * the dot: push, translate (-4, -4, 2), draw obj+0x198.
# (len at [sp], fx32.) The hooks shrink each piece about its own anchor with
# the UI size (the ring and dot about the press point, the head about the
# pen), the shaft in width only, and shorten the shaft by what the smaller
# head no longer covers, so the arrow still runs from the press point to
# the pen. Handler: src/hooks/text_box_size.cpp.
#
# On a widened view a press beside the DS screen is taken inside it, and a
# drag that would leave the screen is shortened (same direction): the
# arrow's two points (r1, r2 = x0, y0; r3, [sp + 0xA0] = x1, y1, after the
# prologue) become the pointer's own, so it is drawn under the pointer, in
# the view's wide part too. The length 0x020968E0 measured from the stored
# points ([sp], r7 = 0 unless the stub) becomes theirs at the join.
[[hook]]
address = 0x02096C50      # mov r6, r0 (after push {r4-r8, lr} ; sub sp, #0x88)
mode = "arm"
name = "Dq9StylusArrowPoints"
registers = ["r1", "r2", "r3", "sp"]

[[hook]]
address = 0x02096D88      # cmp r7, #0 (after the length, or the stub's)
mode = "arm"
name = "Dq9StylusArrowTrueLength"
registers = ["r7", "sp"]

[[hook]]
address = 0x02096E18      # sub r0, r3, #0x8000 (ring: after its push)
mode = "arm"
name = "Dq9StylusArrowPiece"

[[hook]]
address = 0x02096EB0      # ldr r0, [sp] (shaft: after its last push)
mode = "arm"
name = "Dq9StylusArrowShaft"

[[hook]]
address = 0x02096EBC      # bl 0x020C2C04 (r0 = len - 5 px)
mode = "arm"
name = "Dq9StylusArrowLength"
registers = ["r0"]

[[hook]]
address = 0x02096F10      # mov r0, #0xC00 (head: after its translate)
mode = "arm"
name = "Dq9StylusArrowPiece"

[[hook]]
address = 0x02096F48      # sub r0, r0, #0x4000 (dot: after its push)
mode = "arm"
name = "Dq9StylusArrowPiece"

# The stylus dead zone, shrunk with the arrow: the field walks
# (0x02038148) and the arrow points at the pen (0x020968E0) only once the
# pen is 8 px from the press point. Below that the arrow is an 8 px stub
# along the hero's facing (0x02096D7C). The hooks scale the distance for
# the comparison only (it is already stored for the drawing) and the stub.
[[hook]]
address = 0x02038324      # cmp r0, #0x8000 (r0 = pen distance, walk)
mode = "arm"
name = "Dq9StylusDeadZone"
registers = ["r0"]

[[hook]]
address = 0x02096A1C      # cmp r0, #0x8000 (r0 = pen distance, arrow)
mode = "arm"
name = "Dq9StylusDeadZone"
registers = ["r0"]

[[hook]]
address = 0x02096D80      # str r0, [sp] (r0 = 0x8000, stub length)
mode = "arm"
name = "Dq9StylusArrowStub"
registers = ["r0"]

# Mouse-friendly menus (the Game > Mouse-friendly menus setting), part 2:
# the window lists ("list A": camp menu and the other windowed lists).
# Handler: src/hooks/mouse_menus.cpp.
#
# 0x0205C5C0(owner, ...) is a list's pen step (owner+0x94 enables the pen,
# widget w = owner+4). Its first branch (0x0205C6CC) never hits on a fresh
# press: the hit-test 0x0205BD88 maps the rect to an entry through
# 0x0205BD14, which answers -1 until w+0x4E ("a press is being handled") is
# set. 0x0205BC3C then does the work: on a press edge (touch manager
# +0x55) it sets w+0x4E, hit-tests the pen position (0x02012A94 into sp+4 /
# sp+0), stores the entry in w+0x30 and sets w+0x4C only when it equals the
# entry touched before. The caller moves the cursor there (returning 2 when
# it moved). The scene then chooses through 0x0205BD30 (press edge && w+0x4E
# && w+0x4C), and the camp menu states (ov2, e.g. 0x021622EC) only when the
# cursor did not move in the same frame. So the first tap moves the cursor
# and the second chooses.
#
# With the setting on, while no button is held the same code runs on the
# mouse position when it has moved (the cursor follows the mouse; nothing is
# chosen without a press edge), and on a press w+0x4C is always set, so a
# click on the cursor entry chooses it. The entry under the mouse is the
# cursor already, so one click chooses it.
[[hook]]
address = 0x0205BC70      # cmp r0, #0 (r0 = press edge, r4 = widget)
mode = "arm"
name = "Dq9MouseMenuListPress"
registers = ["r0", "r4"]

[[hook]]
address = 0x0205BC8C      # ldr r1, [sp, #4] (x at sp+4, y at sp+0)
mode = "arm"
name = "Dq9MouseMenuListPosition"
registers = ["sp"]

[[hook]]
address = 0x0205BCC4      # movne r0, #0 (Z = same entry as before)
mode = "arm"
name = "Dq9MouseMenuListSame"
registers = ["cpsr"]

[[hook]]
address = 0x0205C65C      # b 0x0205C6C4 (cursor moved to the hit, r5 = owner)
mode = "arm"
name = "Dq9MouseMenuListDone"
registers = ["r5"]

# Mouse-friendly menus, part 4: the simple choice lists ("list B": the
# Yes/No dialogs). Handler: src/hooks/mouse_menus.cpp.
#
# 0x020E26AC(m) steps the list: 0x020E1E5C(m+0x10) hit-tests the pen on a
# press edge (touch manager +0x55; position from 0x02012A94 into sp+4 /
# sp+0) and returns the entry, -1 for no press or -2 for a miss. On a hit
# equal to the cursor (m+0x14) with m+0x17 set ("touched", which 0x020E2844
# draws as the green look) it chooses it (m+0x15 = cursor); then it sets
# m+0x17 and moves the cursor there. 0x020E2928 hands the choice to the
# scene only on a frame with a press edge or A / L / R. So the first tap
# turns an entry green and the second chooses it.
#
# With the setting on, while no button is held the hit-test runs on the
# mouse position when it has moved, and the choice is skipped, so the entry
# under the mouse turns green. A click chooses the entry under it at once.
[[hook]]
address = 0x020E1E70      # cmp r1, #0 (r1 = press edge, r4 = m+0x10)
mode = "arm"
name = "Dq9MouseMenuChoicePress"
registers = ["r1", "r4"]

[[hook]]
address = 0x020E1E84      # ldr r1, [sp, #4] (x at sp+4, y at sp+0)
mode = "arm"
name = "Dq9MouseMenuChoicePosition"
registers = ["sp"]

[[hook]]
address = 0x020E26CC      # cmp r2, r0 (r2 = cursor, r0 = entry under the pen)
mode = "arm"
name = "Dq9MouseMenuChoiceSame"
registers = ["r0", "r2"]

[[hook]]
address = 0x020E26D8      # cmp r1, #0 (r1 = m+0x17, touched before)
mode = "arm"
name = "Dq9MouseMenuChoiceTouched"
registers = ["r1"]

# Mouse-friendly menus, part 5: the layout menus ("list C": shop, Patty's
# party planner, Krak Pot...). The guest code and the per-scene press hooks
# are described in dq9_arm9_ov003.toml. Handler: src/hooks/mouse_menus.cpp.
[[hook]]
address = 0x02080DE4      # entry of the tap routine (r2 = x, r3 = y)
mode = "arm"
name = "Dq9MouseMenuTapPosition"
registers = ["r2", "r3"]

[[hook]]
address = 0x02080E28      # tst r0, #4 (r0 = flags of the item hit, bit 2 = touched)
mode = "arm"
name = "Dq9MouseMenuTapChoose"
registers = ["r0"]

# Click on the top screen (or a new right click in the results box, manager
# state 3) = A, while a message box is up. The per-frame pad
# update 0x020122AC(pad) stores the keys held this frame (r0, from
# 0x02012364) at `strh r0, [r5]`; the game's own "pressed" test is
# held & !previous, so OR-ing A in for one frame is a real press for
# whatever code waits on the box (the manager's page break, the battle
# results, ...). Handler: Dq9MessageTopClick in src/hooks/mouse_menus.cpp.
[[hook]]
address = 0x0201232C      # strh r0, [r5] (r0 = keys held this frame)
mode = "arm"
name = "Dq9MessageTopClick"
registers = ["r0"]

# Instant text (with the Skip text option, B prints the whole box). The message manager's step
# _sub_020444E4_0 (0x020444E4, body 0x02065xxx) prints text each frame: R4 is
# the speed (0x10 = one character per frame, 0x18 fast), the accumulator at
# mgr+0x80 gains R4 * 16 (4-bit fraction) and R9 = the whole characters to
# print this frame, run by the loop at 0x02065EE8 (mgr+0x78 = next character,
# mgr+0x6C = length). The loop already stops at the end of the text and at
# every page-break / wait / choice code, so a huge R4 prints up to the next
# stop. Handler: src/hooks/text_instant.cpp.
[[hook]]
address = 0x02065D14      # add r2, r3, r4, lsl #4 (r4 = characters per frame)
mode = "arm"
name = "Dq9TextInstant"
registers = ["r4"]

# 60 FPS mode, Accurate, part 2: the 2D message window. 0x020439C0(mgr, flag), once
# per pass of the main loop (ov17 0x0218C910), redoes the window while its
# text is appearing: lays the whole text out again (0x02066D00), draws the
# frame and uploads the 18 KB tile buffer.
#   0x020439D0  ldrb r2, [r2, #0x9CC]   ; mgr + 0x19CC: the 2D window is up
#   0x020439D8  cmp  r2, #0
#   0x020439DC  beq  0x02043E94         ; past the 2D block
# At 60 FPS that is twice the original's work per second, so the hook takes
# the branch on every other pass: the window is redrawn 30 times a second,
# as in the original. Handler: src/hooks/frame_rate.cpp.
[[hook]]
address = 0x020439DC      # beq 0x02043E94 (r2 = 2D window up, r10 = manager, lr = caller)
mode = "arm"
name = "Dq9TextWindowHalfRate"
registers = ["r2", "r10", "lr"]
on_true = "jump"
jump_address = 0x02043E94
on_false = "continue"

# Part 3: while a choice list is up the block must run on every pass (it places
# the hand cursor sprite), so on every other such pass only the tile upload is
# skipped (18 requests through 0x020DC0F0, the costly part):
#   0x02043C24  ldr  r3, [r10, #0x34]   ; the tile buffer's descriptor
#   0x02043C28  cmp  r3, #0
#   0x02043C2C  beq  0x02043C98         ; past the upload loop
# The pass is chosen by Dq9TextWindowHalfRate. Handler: src/hooks/frame_rate.cpp.
[[hook]]
address = 0x02043C2C      # beq 0x02043C98 (r3 = tile buffer descriptor)
mode = "arm"
name = "Dq9TextWindowSkipUpload"
registers = ["r3"]
on_true = "jump"
jump_address = 0x02043C98
on_false = "continue"

# Part 4: the heap block lookup in ITCM, reached from free (0x01FF8ADC) and the
# upload requests (0x01FF8B48) through 0x01FF8AE4/8C44/8CB0. It scans 128
# entries of 6 bytes ({u16 offset, u16, u16 flags}) one guest instruction at a
# time, and tops the ARM9 profile while a dialogue choice is shown:
#   0x01FF88C4  ldr r0, =base (0x01FF8914) ; sub r2, r1, r0
#               cmp r2, #0x5000 ; movcs r0, #0 ; bxcs lr
#               ldr r0, =table (0x01FF8918) ; mov r3, #0 ; b 0x01FF8904
#   0x01FF88E4  ldrh r1, [r0, #4] ; tst r1, #1 ; beq 0x01FF88FC
#               ldrh r1, [r0] ; cmp r1, r2 ; bxeq lr
#   0x01FF88FC  add r3, r3, #1 ; add r0, r0, #6
#   0x01FF8904  cmp r3, #0x80 ; bcc 0x01FF88E4 ; mov r0, #0 ; bx lr
# In every mode the hook does the search natively (same r0-r3 and NZCV on exit)
# and returns. Handler: src/hooks/frame_rate.cpp.
[[hook]]
address = 0x01FF88C4      # function entry (r1 = pointer, lr = return address)
mode = "arm"
name = "Dq9HeapBlockLookup"
registers = ["r0", "r1", "r2", "r3", "cpsr"]
on_true = "return"
on_false = "continue"

# Part 5: the kerning search 0x020425F4(prev, cur, font), run for every
# character of the window and of the choice options on every pass. A linear
# scan of the font's pair table (4-byte entries: u16 prev | cur << 8, s8):
#   0x020425F4  ldr r12, =0x0210782C ; and r3, r0, #0xFF
#               ldr r2, [r12, r2, lsl #2]   ; font
#               mov r0, r1, lsl #24 ; orr r0, r3, r0, lsr #16
#               ldr r3, [r2, #8]            ; count
#               mov r0, r0, lsl #16 ; ldr r2, [r2, #0xC] ; table
#               mov r12, #0 ; b 0x02042634
#   0x0204261C  ldrh r1, [r2] ; cmp r1, r0, lsr #16
#               ldrsbeq r0, [r2, #2] ; bxeq lr
#               add r2, r2, #4 ; add r12, r12, #1
#   0x02042634  cmp r12, r3 ; bcc 0x0204261C ; mov r0, #0 ; bx lr
# In every mode the hook does the scan natively (same r0-r3, r12 and NZCV on
# exit) and returns. Handler: src/hooks/frame_rate.cpp.
[[hook]]
address = 0x020425F4      # function entry (r0 = previous char, r1 = char, r2 = font)
mode = "arm"
name = "Dq9KerningLookup"
registers = ["r0", "r1", "r2", "r3", "r12", "cpsr"]
on_true = "return"
on_false = "continue"

# Part 6: the 4bpp blitter 0x0204E1D8(desc, src, x, y; w, h, mask_odd,
# mask_even on the stack), which ORs a glyph or frame bitmap into the
# window's tile buffer ([desc + 8], 32 bytes a tile, [desc + 0xA8] tiles a
# row, [desc + 0xAA] rows), two pixels per byte. Called for every glyph
# (0x0204ECC4/0x0204EA6C, up to five times for outlined text) and by the frame
# drawer 0x020435B8. The time-weighted profile of a choice
# (performance-20261111-180942.jsonl) is dominated by its inner loop
# 0x0204E26C..0x0204E3BC: the options and the choice frame are redrawn on
# every pass. In every mode the hook runs the same loop natively (quirks kept:
# a pixel is written when its tile column OR row is in range, 16-bit
# truncation of the coordinates and the offset) and returns.
# Handler: src/hooks/frame_rate.cpp.
[[hook]]
address = 0x0204E1D8      # function entry, before push {r4-r11, lr}
mode = "arm"
name = "Dq9Blit4bpp"
registers = ["r0", "r1", "r2", "r3", "r12", "sp"]
on_true = "return"
on_false = "continue"

# Part 7: MI_CpuSend32(src, dest, size), which the 3D model renderer uses to
# push display lists into GXFIFO (0x04000400) one word at a time:
#   0x020CA440  add r12, r0, r2
#   0x020CA444  cmp r0, r12 ; ldmlt r0!, {r2} ; strlt r2, [r1] ; blt 0x020CA444
#               bx lr
# (the SDK's conditional forms, emitted as branches). The busiest ARM9 MMIO
# site in a town at 60 FPS. The hook feeds the words to the geometry engine
# natively until the FIFO stalls, then hands the rest to the loop.
# Handler: src/hooks/frame_rate.cpp.
[[hook]]
address = 0x020CA440      # function entry (r0 = src, r1 = dest, r2 = bytes)
mode = "arm"
name = "Dq9GxFifoSend"
registers = ["r0", "r1", "r2", "r12", "cpsr"]
on_true = "return"
on_false = "continue"

# Part 8: NNS G3D's G3dGeBufferOP_N(cmd, params, n), 0x020B6ADC, run for
# every geometry command of every model. State {buffer, busy} at
# [0x020B6BB8]:
#   buffer && busy && count + 1 + n <= 0xC0: append cmd and params (RAM)
#   buffer && count: flush through 0x020B69A8; busy: wait at 0x020B6A04
#   otherwise: str cmd, [GXFIFO] ; bl MI_CpuSend32(params, GXFIFO, n * 4)
# The hook does the append and the direct write natively (not on a stalled
# FIFO, and for at most 32 parameters) and returns; the rest runs the guest
# code. Handler: src/hooks/frame_rate.cpp.
[[hook]]
address = 0x020B6ADC      # function entry, before push {r4-r6, lr}
mode = "arm"
name = "Dq9GeBufferCommand"
registers = ["r0", "r1", "r2"]
on_true = "return"
on_false = "continue"

# Part 9: box-test culling. NNS model culling (0x0207E98C, and the two map
# object paths at 0x02017218 and 0x0203F2C0) writes BOX_TEST, then spins:
#   mov r0, rX ; bl G3X_GetBoxTestResult (0x020C56C0) ; cmp r0, #0 ; bne <mov>
# G3X_GetBoxTestResult returns -1 while GXSTAT bit 0 is set. The hook, at
# the loop head, has the scheduler hold the ARM9 until the test is done
# (nds_title_wait_gx_test) rather than run thousands of polls a frame.
# Handler: src/hooks/frame_rate.cpp.
[[hook]]
address = 0x020173F8      # mov r0, r8 (poll loop head)
mode = "arm"
name = "Dq9BoxTestWait"

[[hook]]
address = 0x0203F6F8      # mov r0, r6 (poll loop head)
mode = "arm"
name = "Dq9BoxTestWait"

[[hook]]
address = 0x0207EA14      # mov r0, r4 (poll loop head)
mode = "arm"
name = "Dq9BoxTestWait"

# Right click = the message box's "next" key, like B (0x403 = A/B/X in the
# check at 0x020440DC, which sets r5 = 1). The hook runs after the second key
# test, before `cmp r0, #0` at 0x02044168. Handler: Dq9TextAdvanceRightClick
# in src/hooks/text_instant.cpp.
[[hook]]
address = 0x02044168      # cmp r0, #0 (r5 = "advance" flag)
mode = "arm"
name = "Dq9TextAdvanceRightClick"
registers = ["r5"]

# Analog stick movement: the left stick walks at any angle. The
# hero's per-frame movement 0x02038148(hero) takes the D-pad first: it sets
# a direction code hero+0x250 = 8..15 (up, down, left, right, then the
# diagonals) and walks at the code's angle (table 0x020E781C, fx12 radians
# from 0 = down towards right) plus the camera yaw (0x0202E800), wrapped to
# [0, 2pi) by 0x02030F40. Then, unless hero+0x255 already holds this code,
# it snaps the angle to a nearby path's direction (0x0201E90C, +0x18) or its
# opposite when within pi/4, caching it in hero+0x255 / +0x256. The hook
# swaps the code's angle for the left stick's and jumps past the snap to
# 0x02038490, which clears the cache and walks (0x02033844(hero, r6)), as
# the stylus path does. Handler: src/hooks/analog_movement.cpp.
[[hook]]
address = 0x020383F0      # cmp r3, r2 (r2 = code, r6 = angle + yaw, wrapped)
mode = "arm"
name = "Dq9AnalogMovement"
registers = ["r2", "r6"]
on_true = "jump"
jump_address = 0x02038490 # mvn r0, #0 ; strb r0, [r4, #0x255] ; walk at r6

# The top screen's field map can be dragged with the mouse, like an image on
# a phone. 0x02024528(map) (mode 0 of the top-screen step 0x020235D8) works
# out the map's centre in map pixels from its own player-following centre
# (map+1452/+1456) and stores it at map+68/+72, from which the map pieces,
# the BG's fine scroll (0x02027448), the icons and the party markers are all
# placed. The hook adds the drag's offset to it before the store. Handler:
# Dq9TopMapPan in src/hooks/mouse_menus.cpp.
[[hook]]
address = 0x02024794      # str r5, [r4, #0x44] (r5 / r6 = centre x / y)
mode = "arm"
name = "Dq9TopMapPan"
registers = ["r4", "r5", "r6", "sp"]

# Unlimited quests (the General > Unlimited quests setting). Handler:
# src/hooks/quest_limit.cpp; the audit behind it is in that file's comment.
#
# The quest manager 0x02109418 holds the accepted quests as a u8 count and
# 8 sorted 16-byte slots at +4 (word 0: id in bits 0-8, flags above; u16
# progress counters at +4..+14), with other quest data from +0x84. The
# save copies mgr[0, 0xA0). Past 8 quests the slots move to free ITCM
# (0x01FFF280) and every walk of the slots is pointed there: each site's
# `base = mgr + 4` gets Dq9QuestSlotBase after it.
[[hook]]
address = 0x02096164      # add r3, r0, #4 (find 0x02096144: slot base)
mode = "arm"
name = "Dq9QuestSlotBase"
registers = ["r3"]
when = "after"

[[hook]]
address = 0x02062CB4      # add r3, r0, #4 (script cmd 0x90: unbounded find)
mode = "arm"
name = "Dq9QuestSlotBase"
registers = ["r3"]
when = "after"

[[hook]]
address = 0x0209522C      # ldr r1, =0x0210941C (questorder turn-in records:
mode = "arm"              # kept only for quests in the slots)
name = "Dq9QuestSlotBase"
registers = ["r1"]
when = "after"

# The limit: accept 0x020961C0 returns 0 at count >= 8, and script
# condition 0x57 (in 0x0205FB04) asks count == 8 / count < 8 for the
# givers' "too many quests" branch.
[[hook]]
address = 0x020961D4      # cmp r0, #8 (r0 = count)
mode = "arm"
name = "Dq9QuestAcceptLimit"
registers = ["r0"]

[[hook]]
address = 0x020617F0      # cmp r1, #0 (r0 = count, r1 = which question)
mode = "arm"
name = "Dq9QuestFullCheck"
registers = ["r0"]

# Insert 0x02096304 (slot passed by value: r1-r3 + stack, spilled to
# sp+0x94 after the prologue) refuses at 8 and copies the 8 slots through a
# 0x80-byte stack buffer; past 8 the handler inserts and the game's tail
# sets the state and raises the count.
[[hook]]
address = 0x02096318      # cmp r0, #8 (r0 = count, r5 = mgr)
mode = "arm"
name = "Dq9QuestInsert"
registers = ["r0", "r5", "sp"]
on_true = "jump"
jump_address = 0x02096434 # bl 0x0205EC44 (state 2, ++count, return 1)
on_false = "continue"

# Remove 0x0209646C (from turn-in 0x02095D0C and cancel 0x02095D40):
# searches mgr+4 and closes the gap through a 0x90-byte stack buffer.
[[hook]]
address = 0x0209646C      # function entry (r0 = mgr, r1 = quest id)
mode = "arm"
name = "Dq9QuestRemove"
registers = ["r0", "r1"]
on_true = "return"
on_false = "continue"

# Upright billboards that face the camera. NNS G3D runs a model's render
# commands through the table at 0x020F1E08: BBY (Y-axis billboard) is
# 0x020B5404, SHP (draw a shape) is 0x020B4BFC (r0 = render state; shape
# dictionary at +0xDC, index at command byte 1, display list at
# NNSG3dResShp +8/+12). Some single-quad BBY models (the standing torches in
# churches) have their quad turned about Y in the model data, so it stands
# slanted. The first hook marks a BBY node; the second straightens the quad
# in the next shape's display list before it is sent.
# Handler: src/hooks/billboard_quads.cpp.
[[hook]]
address = 0x020B5404      # function entry, before push {r3-r11, lr}
mode = "arm"
name = "Dq9BillboardYNode"

[[hook]]
address = 0x020B4BFC      # function entry, before push {r4, lr}
mode = "arm"
name = "Dq9BillboardShape"
registers = ["r0"]

# Save: 0x020A9EC8 builds the image (state machine 0x020AAD2C writes it to
# EEPROM [0x10, 0x6FF4) and the backup copy at 0x8010). Load: 0x020AAF94
# and 0x020AB324 (from ov31) copy the block back into mgr.
[[hook]]
address = 0x020AA928      # bl 0x02075ADC (r1 = mgr, r2 = 0xA0)
mode = "arm"
name = "Dq9QuestSave"
registers = ["r1", "r2"]

[[hook]]
address = 0x020AB104      # bl 0x02094D7C, after the 0xA0 copy into mgr
mode = "arm"
name = "Dq9QuestLoad"

[[hook]]
address = 0x020AB4C0      # bl 0x02094D7C, after the 0xA0 copy into mgr
mode = "arm"
name = "Dq9QuestLoad"

# Gathering spots after a Continue. The spots live in the save (100 words at
# save + 0x5CDC: countdown, item mask, interval...). When the field starts
# without a quick save to resume (ov17 0x0218B710 -> 0x0208EA20),
# 0x0208EC14 empties every spot that still has items and restarts its
# countdown at a tenth of the normal wait, so a church save loses the
# unpicked materials (they come back later, re-rolled). The hook skips that
# call, so the spots stay as they were saved, as after a quick save.
# Handler: src/hooks/gathering_spots.cpp.
[[hook]]
address = 0x0208EA6C      # bl 0x0208EC14 ; b 0x0208EBF4 (epilogue)
mode = "arm"
name = "Dq9KeepGatheringSpots"
on_true = "jump"
jump_address = 0x0208EA70 # b 0x0208EBF4

# Japanese release, the font. 0x02042954 loads the two fonts (s7, me) into
# the boot heap (fi_<f>.bin index + fd_<f>.bin strip, pointers at
# 0x0210782C / 0x02107834); the hook runs after the second load, before
# `bl 0x0202F7F8`, and when the cartridge carries the Japanese fonts swaps in
# copies with their glyphs added. Handler: src/hooks/ja_font.cpp.
[[hook]]
address = 0x02042988      # bl 0x0202F7F8 (both fonts loaded)
mode = "arm"
name = "Dq9JaFont"

# The glyph searches, linear scans of the font's entries with memcmp
# (0x02001AEC): 0x020424F4(str, font) -> index or -1, 0x0204255C(str,
# font) -> entry or 0. Done natively in every mode (the bank then returns).
# Handler: src/hooks/ja_font.cpp.
[[hook]]
address = 0x020424F4      # function entry, before push {r4-r6, lr}
mode = "arm"
name = "Dq9GlyphIndex"
registers = ["r0", "r1"]
on_true = "return"
on_false = "continue"

[[hook]]
address = 0x0204255C      # function entry, before push
mode = "arm"
name = "Dq9GlyphEntry"
registers = ["r0", "r1"]
on_true = "return"
on_false = "continue"

# Message windows keep each distinct glyph in one of 128 cells (mgr+0x9B8,
# 28 bytes each, use counts at mgr+0x17B8), staged through 32 upload slots
# (bits at mgr+0x2CC, freed once per pass by 0x020439C0); a line's cells are
# released when it scrolls away (0x0206B62C). The layout pass 0x02067B38,
# called a few times a frame by 0x02067E68, lays the text out ahead of the
# printing, one new cell per call:
#   0x02067CE0  bl  0x02045C10          ; the cell showing this glyph, or -1
#   0x02067CE4  cmp r0, #0              ; ... -1: 0x020459C8 makes one
# With all cells taken 0x020459C8 gives cell 0, so every later glyph is drawn
# as the message's first: Latin text never has 128 different glyphs in view
# and ahead, a long Japanese message does. When a new cell is needed and no
# cell or upload slot is free, the hook leaves through the epilogue with
# nothing changed, and the pass resumes from that glyph on a later call,
# once the lines above have scrolled away. Handler: src/hooks/ja_font.cpp.
[[hook]]
address = 0x02067CE4      # cmp r0, #0 (r0 = cell or -1, r10 = message manager)
mode = "arm"
name = "Dq9GlyphCellWait"
registers = ["r0", "r10"]
on_true = "jump"
jump_address = 0x02067E58 # add sp, sp, #0xC ; pop {r4-r11, pc}
on_false = "continue"

# The message word wrap 0x0206B984 does not break a line at its own start
# (a space-less Japanese line a little wider than the limit went down a
# row, under the window). Handler: Dq9WrapAtLineStart, src/hooks/ja_font.cpp.
[[hook]]
address = 0x0206BDE8      # bge 0x0206BEA8 (no break; [sp+0x20] = break point's output)
mode = "arm"
name = "Dq9WrapAtLineStart"
registers = ["sp"]
on_true = "jump"
jump_address = 0x0206BEA8 # add r11, r11, #1 (the no-break path)
on_false = "continue"
