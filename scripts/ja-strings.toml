# Japanese text for YDQP text units that YDQJ has no file for (its code
# writes these lines itself), applied by scripts/ja-convert.py.
#
# [unit] (a ja-map unit: the PAL file or member, language left out), then
# record id (the record's first word) = the line, in YDQP's form: its tags
# (<ACTOR>, <SGL_M_NAME>, <val_1>, <IF_SING val_1>...: a name without an
# article), "\n" (backslash n) for a line break. Japanese has no spaces for
# the window's word wrap: lines are broken by hand. Records left out keep
# YDQP's English.

